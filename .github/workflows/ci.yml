name: Node CI

# Production stays Express `npm start` (Railway GitHub integration).
# Do not add a GitHub Pages deploy job.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    # Rebuild/test only. Railway (not Pages) deploys the Node server.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke /api/health
        env:
          JWT_SECRET: ci-smoke-secret
        run: |
          npm start &
          pid=$!
          ok=0
          for i in $(seq 1 25); do
            if curl -fsS http://127.0.0.1:8787/api/health >/tmp/health.json; then
              ok=1
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          test "$ok" = "1"
          python3 -c "import json; d=json.load(open('/tmp/health.json')); assert d.get('ok') is True"
